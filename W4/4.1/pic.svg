<svg xmlns="http://www.w3.org/2000/svg" width="988" height="982" viewBox="0 0 988 982">
  <defs>
    <!-- Cây: dùng lại nhiều lần -->
    <g id="cay">
      <rect x="158" y="519" width="40" height="180" fill="#A0522D"/>
      <rect x="172" y="519" width="10" height="180" fill="#8B4513"/>
      <circle cx="138" cy="419" r="60" fill="#228B22"/>
      <circle cx="218" cy="419" r="60" fill="#228B22"/>
      <circle cx="178" cy="459" r="60" fill="#228B22"/>
      <!-- mảng sáng cho tán lá -->
      <circle cx="150" cy="405" r="22" fill="#32a832"/>
      <circle cx="225" cy="410" r="18" fill="#32a832"/>
      <circle cx="185" cy="450" r="16" fill="#32a832"/>
    </g>

    <!-- Đám mây -->
    <g id="may" fill="#ff5c8a">
      <ellipse cx="0" cy="0" rx="70" ry="28"/>
      <ellipse cx="45" cy="-15" rx="45" ry="25"/>
      <ellipse cx="-40" cy="-12" rx="38" ry="22"/>
    </g>

    <!-- Bông hoa -->
    <g id="hoa">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#0b5d0b" stroke-width="3"/>
      <circle cx="-7" cy="0" r="6" fill="#ff5c8a"/>
      <circle cx="7" cy="0" r="6" fill="#ff5c8a"/>
      <circle cx="0" cy="-7" r="6" fill="#ff5c8a"/>
      <circle cx="0" cy="7" r="6" fill="#ff5c8a"/>
      <circle cx="0" cy="0" r="4" fill="#ffe14d"/>
    </g>

    <!-- Bụi cỏ -->
    <g id="co" stroke="#0b5d0b" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 0 L-6 -18"/>
      <path d="M0 0 L0 -22"/>
      <path d="M0 0 L7 -17"/>
    </g>
  </defs>

  <!-- Bầu trời và mặt đất -->
  <rect x="0" y="0" width="988" height="600" fill="#87CEEB"/>
  <rect x="0" y="600" width="988" height="382" fill="#008000"/>

  <!-- Mây -->
  <use href="#may" x="200" y="140"/>
  <use href="#may" x="470" y="90" transform="translate(470,90) scale(0.7) translate(-470,-90)"/>
  <use href="#may" x="640" y="300" transform="translate(640,300) scale(0.6) translate(-640,-300)"/>

  <!-- Mặt trời + tia nắng -->
  <g stroke="#f0ed18" stroke-width="6" stroke-linecap="round">
    <line x1="798" y1="90" x2="798" y2="60"/>
    <line x1="798" y1="308" x2="798" y2="338"/>
    <line x1="690" y1="199" x2="660" y2="199"/>
    <line x1="906" y1="199" x2="936" y2="199"/>
    <line x1="722" y1="123" x2="700" y2="101"/>
    <line x1="874" y1="123" x2="896" y2="101"/>
    <line x1="722" y1="275" x2="700" y2="297"/>
    <line x1="874" y1="275" x2="896" y2="297"/>
  </g>
  <circle cx="798" cy="199" r="80" fill="#f0ed18"/>

  <!-- Chim -->
  <g fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round">
    <path d="M560 160 q12 -14 24 0 q12 -14 24 0"/>
    <path d="M620 200 q10 -12 20 0 q10 -12 20 0"/>
  </g>

  <!-- Cây phía sau -->
  <use href="#cay"/>

  <!-- Ống khói (vẽ trước mái để mái đè lên chân ống khói) -->
  <rect x="590" y="270" width="40" height="90" fill="#A0522D"/>
  <rect x="584" y="262" width="52" height="12" fill="#8B4513"/>

  <!-- Ngôi nhà -->
  <rect x="298" y="399" width="400" height="300" fill="#8B4513"/>
  <polygon points="298,399 498,199 698,399" fill="#CD853F"/>
  <polygon points="298,399 498,199 698,399" fill="none" stroke="#a5672c" stroke-width="6" stroke-linejoin="round"/>

  <!-- Cửa sổ có khung -->
  <rect x="338" y="439" width="80" height="80" fill="#ADD8E6"/>
  <rect x="578" y="439" width="80" height="80" fill="#ADD8E6"/>
  <g stroke="#ffffff" stroke-width="4" fill="none">
    <rect x="338" y="439" width="80" height="80"/>
    <rect x="578" y="439" width="80" height="80"/>
    <line x1="378" y1="439" x2="378" y2="519"/>
    <line x1="338" y1="479" x2="418" y2="479"/>
    <line x1="618" y1="439" x2="618" y2="519"/>
    <line x1="578" y1="479" x2="658" y2="479"/>
  </g>

  <!-- Cửa ra vào -->
  <rect x="458" y="539" width="80" height="160" fill="#A0522D"/>
  <circle cx="518" cy="619" r="10" fill="#000000"/>

  <!-- Con đường -->
  <path d="M470 699 C300 740 250 790 290 830 C340 880 420 920 462 982"
        fill="none" stroke="#FFA500" stroke-width="10"/>
  <path d="M535 699 C380 730 310 780 340 830 C380 870 500 920 555 982"
        fill="none" stroke="#FFA500" stroke-width="10"/>

  <!-- Sỏi trên đường -->
  <g fill="#b5b5b5">
    <ellipse cx="500" cy="712" rx="12" ry="7"/>
    <ellipse cx="400" cy="728" rx="13" ry="8"/>
    <ellipse cx="335" cy="760" rx="12" ry="7"/>
    <ellipse cx="318" cy="805" rx="10" ry="6"/>
    <ellipse cx="357" cy="864" rx="13" ry="8"/>
    <ellipse cx="410" cy="900" rx="12" ry="7"/>
    <ellipse cx="464" cy="938" rx="13" ry="8"/>
    <ellipse cx="510" cy="970" rx="11" ry="6"/>
  </g>
  <g fill="#8f8f8f">
    <ellipse cx="450" cy="716" rx="9" ry="5"/>
    <ellipse cx="365" cy="745" rx="9" ry="5"/>
    <ellipse cx="335" cy="835" rx="8" ry="5"/>
    <ellipse cx="385" cy="882" rx="9" ry="5"/>
    <ellipse cx="437" cy="920" rx="9" ry="5"/>
    <ellipse cx="488" cy="955" rx="8" ry="5"/>
  </g>
  <g fill="#d6d6d6">
    <ellipse cx="480" cy="725" rx="7" ry="4"/>
    <ellipse cx="345" cy="782" rx="7" ry="4"/>
    <ellipse cx="380" cy="845" rx="7" ry="4"/>
    <ellipse cx="445" cy="890" rx="7" ry="4"/>
  </g>

  <!-- Sỏi rải quanh nhà và trên cỏ -->
  <g fill="#b5b5b5">
    <ellipse cx="270" cy="712" rx="10" ry="6"/>
    <ellipse cx="240" cy="730" rx="8" ry="5"/>
    <ellipse cx="600" cy="720" rx="10" ry="6"/>
    <ellipse cx="640" cy="738" rx="8" ry="5"/>
    <ellipse cx="700" cy="760" rx="10" ry="6"/>
  </g>
  <g fill="#8f8f8f">
    <ellipse cx="255" cy="722" rx="6" ry="4"/>
    <ellipse cx="620" cy="728" rx="6" ry="4"/>
    <ellipse cx="720" cy="775" rx="7" ry="4"/>
  </g>

  <!-- Hoa và cỏ dưới chân nhà -->
  <use href="#hoa" x="330" y="680"/>
  <use href="#hoa" x="365" y="688"/>
  <use href="#hoa" x="430" y="682"/>
  <use href="#hoa" x="600" y="682"/>
  <use href="#hoa" x="640" y="688"/>
  <use href="#co" x="300" y="705"/>
  <use href="#co" x="570" y="708"/>
  <use href="#co" x="680" y="712"/>
  <use href="#co" x="150" y="740"/>
  <use href="#co" x="820" y="700"/>
  <use href="#co" x="880" y="850"/>
  <use href="#co" x="120" y="880"/>

  <!-- Cây phía trước (gần, to hơn) -->
  <use href="#cay" transform="translate(20,341) scale(0.8)"/>
  <use href="#cay" transform="translate(620,341) scale(0.8)"/>

  <!-- Cây nhỏ ở góc phải -->
  <use href="#cay" transform="translate(830,500) scale(0.5)"/>
</svg>

